name: Build and deploy Hugo

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_status: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v4
      - name: Check source-note mirrors
        run: python scripts/check_source_mirrors.py
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true
      - run: hugo --minify --baseURL "https://qiuyi111.github.io/SpaceX-handbook/"
      - id: pages
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/configure-pages@v5
      - if: github.event_name == 'push' && steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - if: github.event_name == 'push' && steps.pages.outcome != 'success'
        run: echo "Pages is not enabled yet. Enable Settings > Pages > Build and deployment > GitHub Actions, then rerun this workflow."

  deploy:
    if: github.event_name == 'push' && needs.build.outputs.pages_status == 'success'
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
