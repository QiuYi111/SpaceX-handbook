baseURL = "https://qiuyi111.github.io/SpaceX-handbook/"
locale = "zh-CN"
title = "SpaceX Engineering Handbook"
enableRobotsTXT = true
enableGitInfo = true
pluralizeListTitles = false

[params]
  title = "SpaceX Engineering Handbook"
  description = "基于公开资料重建的 SpaceX 工程方法手册"
  github_repo = "https://github.com/QiuYi111/SpaceX-handbook"
  github_branch = "master"
  offlineSearch = true
  copyright = "SpaceX Engineering Handbook"

[params.ui]
  sidebar_menu_compact = false
  sidebar_menu_foldable = true
  sidebar_search_disable = false
  navbar_logo = false
  footer_about_disable = true
  showLightDarkModeMenu = true
  breadcrumb_disable = false

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 4
  ordered = false

[security.funcs]
  getenv = ["^HUGO_", "^CI$", "PERISCOPE_EMBED_API_KEY", "PUBLIC_HANDBOOK_REF"]

[module]
  proxy = "https://proxy.golang.org"

[module.hugoVersion]
  extended = true
  min = "0.166.0"

[[module.imports]]
  path = "gitlab.com/gitlab-com/content-sites/docsy-gitlab"
  ignoreConfig = true

  [[module.imports.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.imports.mounts]]
    source = "assets"
    target = "assets"
  [[module.imports.mounts]]
    source = "static"
    target = "static"

[[module.imports]]
  path = "github.com/google/docsy/theme"

[[menus.main]]
  name = "Handbook"
  pageRef = "/handbook"
  weight = 10

[[menus.main]]
  name = "来源"
  pageRef = "/sources"
  weight = 20

[[menus.main]]
  name = "方法"
  pageRef = "/method"
  weight = 30

[[menus.main]]
  name = "GitHub"
  url = "https://github.com/QiuYi111/SpaceX-handbook"
  weight = 40
