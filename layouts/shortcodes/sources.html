<div class="source-list">
{{ range hugo.Data.sources }}
  <div class="source-row" id="{{ .id }}">
    <div><span class="source-chip tier-{{ lower .tier }}">{{ .id }} · {{ .tier }}</span></div>
    <div>
      <a href="{{ .url }}" target="_blank" rel="noopener"><strong>{{ .title }}</strong></a>
      <div class="muted">{{ .author }} · {{ .date }}</div>
      <div>{{ .themes }}</div>
      <div class="muted"><a href="https://github.com/QiuYi111/SpaceX-handbook/blob/master/research/sources/{{ .id }}.md">研究笔记</a></div>
    </div>
  </div>
{{ end }}
</div>
