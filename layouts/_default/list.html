{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <div class="cards">
    {{ range .Pages.ByWeight }}
      <a class="card" href="{{ .RelPermalink }}">
        <strong>{{ .Title }}</strong>
        {{ with .Params.summary }}<span>{{ . }}</span>{{ end }}
      </a>
    {{ end }}
  </div>
</article>
{{ end }}
